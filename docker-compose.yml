services:
  gotongroyong:
    build: .
    image: gotongroyong:latest
    container_name: gotongroyong
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin123}"
    volumes:
      - gotongroyong-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  gotongroyong-data: